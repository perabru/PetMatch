name: Publicar PetMatch no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
      - name: Verificar JavaScript
        run: |
          node --check script.js
          node --input-type=module --check < firebase-service.js
          node --test tests/*.mjs
      - name: Preparar os arquivos públicos
        run: |
          mkdir -p _site/assets
          cp index.html style.css script.js firebase-service.js .nojekyll _site/
          cp -R assets/. _site/assets/
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
